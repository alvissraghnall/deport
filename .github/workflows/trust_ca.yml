name: Cross Platform Test

on:
  # push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test

      - name: Trust CA (Linux/macOS)
        if: runner.os != 'Windows'
        run: sudo ./target/release/deport trust

      - name: Trust CA (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/deport.exe trust

      - name: Verify trust (Linux)
        if: runner.os == 'Linux'
        run: |
          openssl verify -CApath /etc/ssl/certs /ca.pem

      - name: Verify trust (macOS)
        if: runner.os == 'macOS'
        run: |
          security verify-cert -c /ca.pem 
          # mehnnn please remember to change this CA dir to whatever we settle on. prob using directories sumn local sumn

      - name: Verify trust (Windows)
        if: runner.os == 'Windows'
        run: |
          certutil -store Root